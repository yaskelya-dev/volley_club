services:

  db:
    image: postgres:16-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      # БД доступна локальному Python-приложению,
      # но не публикуется на внешний интерфейс VDS.
      - "127.0.0.1:5432:5432"

    volumes:
      - volleykarelia_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]

      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s


  app:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    environment:

      # Внутри Docker PostgreSQL доступен по hostname db.
      # Значение из DATABASE_URL в .env с localhost намеренно заменяется.
      DATABASE_URL: ${DOCKER_DATABASE_URL}

      # Контейнер должен слушать все интерфейсы.
      HOST: 0.0.0.0
      PORT: 8000

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8000:8000"

    command:
      [
        "python3",
        "-m",
        "src.entrypoint"
      ]


volumes:
  volleykarelia_postgres_data:
